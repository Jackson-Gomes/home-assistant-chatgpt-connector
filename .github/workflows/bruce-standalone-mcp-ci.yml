name: Bruce Standalone MCP Tests
on:
  push:
    branches:
      - feature/bruce-standalone-mcp
    paths:
      - "bruce_connector/**"
      - ".github/workflows/bruce-standalone-mcp-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bruce_connector/**"
      - ".github/workflows/bruce-standalone-mcp-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-bruce-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  protocol_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone connector
        run: python -m pip install -r bruce_connector/requirements.txt
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q bruce_connector
          python -m unittest discover -v -s bruce_connector/tests
          sh -n bruce_connector/run.sh
      - name: Verify no Home Assistant dependency
        run: |
          ! grep -ERn '^(from|import) (homeassistant|ha_client|hassio)' bruce_connector/*.py
          ! grep -Eiq 'supervisor[_./:]|HA_TOKEN|HA_URL' bruce_connector/Dockerfile bruce_connector/run.sh
      - name: Build standalone Docker image
        run: docker build --pull -t bruce-standalone-mcp-test bruce_connector
