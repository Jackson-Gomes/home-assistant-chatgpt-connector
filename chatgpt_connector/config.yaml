name: ChatGPT Connector
version: "0.1.5"
slug: chatgpt_connector
description: MCP connector between ChatGPT and Home Assistant using OpenAI Secure MCP Tunnel
url: https://github.com/Jackson-Gomes/home-assistant-chatgpt-connector
startup: application
boot: auto
init: false
homeassistant_api: true
arch:
  - amd64
  - aarch64
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Local MCP Streamable HTTP endpoint
options:
  tunnel_id: ""
  tunnel_api_key: ""
schema:
  tunnel_id: str
  tunnel_api_key: password
